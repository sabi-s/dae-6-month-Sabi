<!doctype html>
<html><head><meta charset="utf-8">
<title>HVMC Report</title>
<style>
@page { size: Letter; margin: 0.6in 0.6in 0.7in; }
* { box-sizing: border-box; }
body { font-family: "Lato", "Helvetica Neue", Arial, sans-serif; font-size: 10pt; color: #222; line-height: 1.4; margin: 0; }
.runhead { text-align: right; font-size: 8pt; font-style: italic; color: #6b7a90; border-bottom: 1px solid #c9d3e0; padding-bottom: 4px; margin-bottom: 14px; }
h1 { color: #1f3864; text-align: center; font-size: 20pt; margin: 8px 0 2px; }
.sub { color: #4a6fa5; text-align: center; font-size: 12.5pt; font-weight: bold; margin: 0 0 8px; }
.tag { text-align: center; font-style: italic; color: #555; margin-bottom: 16px; }
h2 { color: #1f3864; font-size: 14pt; border-bottom: 2px solid #4a6fa5; padding-bottom: 3px; margin: 22px 0 10px; }
h3 { color: #4a6fa5; font-size: 11pt; margin: 16px 0 6px; page-break-after: avoid; }
h4 { color: #1f3864; font-size: 10pt; margin: 12px 0 4px; }
table { width: 100%; border-collapse: collapse; margin: 6px 0 12px; font-size: 8.6pt; }
tr { page-break-inside: avoid; }
th { background: #1f3864; color: #fff; text-align: left; padding: 5px 6px; font-weight: bold; }
td { border: 1px solid #c9d3e0; padding: 4px 6px; vertical-align: top; }
tbody tr:nth-child(even) td { background: #f3f6fa; }
table.kv td:first-child { background: #eef2f8; font-weight: bold; width: 26%; }
.met { color: #1b7a3a; font-weight: bold; } .part { color: #b26b00; font-weight: bold; } .gap { color: #b3261e; font-weight: bold; }
.note { font-style: italic; font-size: 8.6pt; color: #444; }
.box { border-left: 4px solid #4a6fa5; background: #f3f6fa; padding: 8px 10px; margin: 8px 0 12px; }
.pb { page-break-before: always; }
.fig { text-align: center; margin: 8px 0; page-break-inside: avoid; }
.cap { font-size: 8.5pt; color: #555; font-style: italic; text-align: center; margin-top: 2px; }
ul { margin: 4px 0 10px; padding-left: 20px; } li { margin: 2px 0; }
.foot { font-size: 8pt; font-style: italic; color: #6b7a90; margin-top: 18px; }
</style></head>
